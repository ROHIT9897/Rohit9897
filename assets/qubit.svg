<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="glow" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.04"/>
    </radialGradient>
  </defs>

  <circle cx="150" cy="150" r="100" fill="url(#glow)" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- equator -->
  <ellipse cx="150" cy="150" rx="100" ry="30" fill="none" stroke="#38bdf8" stroke-opacity="0.5"/>
  <!-- rotating meridian -->
  <ellipse cx="150" cy="150" rx="100" ry="100" fill="none" stroke="#34d399" stroke-opacity="0.45">
    <animate attributeName="rx" values="100;0;100" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- axes -->
  <line x1="150" y1="30" x2="150" y2="270" stroke="#64748b" stroke-opacity="0.7" stroke-dasharray="4 4"/>
  <line x1="40" y1="150" x2="260" y2="150" stroke="#64748b" stroke-opacity="0.35" stroke-dasharray="4 4"/>

  <!-- latitude ring of the state -->
  <ellipse cx="150" cy="93" rx="82" ry="24.6" fill="none" stroke="#f472b6" stroke-opacity="0.45" stroke-dasharray="3 5"/>

  <!-- state vector -->
  <line x1="150" y1="150" x2="232" y2="93" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="x2" values="232;221;191;150;109;79;68;79;109;150;191;221;232" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="93;105.3;114.3;117.6;114.3;105.3;93;80.7;71.7;68.4;71.7;80.7;93" dur="6s" repeatCount="indefinite"/>
  </line>
  <circle r="6" fill="#f472b6" cx="232" cy="93">
    <animate attributeName="cx" values="232;221;191;150;109;79;68;79;109;150;191;221;232" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="93;105.3;114.3;117.6;114.3;105.3;93;80.7;71.7;68.4;71.7;80.7;93" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="150" cy="150" r="3" fill="#e2e8f0"/>

  <g font-family="Courier New, monospace" font-size="16" fill="#e2e8f0">
    <text x="158" y="26">|0⟩</text>
    <text x="158" y="288">|1⟩</text>
  </g>
  <text x="150" y="298" text-anchor="middle" font-family="Courier New, monospace" font-size="1" fill="none">.</text>
</svg>
