<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.08" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <g id="set" font-family="Courier New, monospace" font-size="15" fill="#e2e8f0">
      <rect x="0" y="16" width="96" height="32" rx="16" fill="#7c3aed" fill-opacity="0.22" stroke="#a78bfa"/>
      <text x="48" y="37" text-anchor="middle">Python</text>

      <rect x="112" y="16" width="104" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.2" stroke="#38bdf8"/>
      <text x="164" y="37" text-anchor="middle">FastAPI</text>

      <rect x="232" y="16" width="104" height="32" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#34d399"/>
      <text x="284" y="37" text-anchor="middle">Android</text>

      <rect x="352" y="16" width="80" height="32" rx="16" fill="#f472b6" fill-opacity="0.18" stroke="#f472b6"/>
      <text x="392" y="37" text-anchor="middle">AI/ML</text>

      <rect x="448" y="16" width="136" height="32" rx="16" fill="#7c3aed" fill-opacity="0.22" stroke="#a78bfa"/>
