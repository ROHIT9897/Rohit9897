<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.6" stop-color="#140d2e"/>
      <stop offset="1" stop-color="#0a1f33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="260" fill="url(#bg)"/>

    <!-- faint grid -->
    <g stroke="#ffffff" stroke-opacity="0.04">
      <path d="M0 52H900M0 104H900M0 156H900M0 208H900"/>
      <path d="M90 0V260M180 0V260M270 0V260M360 0V260M450 0V260M540 0V260M630 0V260M720 0V260M810 0V260"/>
    </g>

    <!-- moving waves -->
    <g fill="none" stroke-linecap="round">
      <path stroke="url(#wave)" stroke-width="2.5" d="M0 205 q112.5 -42 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="9s" repeatCount="indefinite"/>
      </path>
      <path stroke="url(#wave)" stroke-width="1.5" stroke-opacity="0.6" d="M0 215 q112.5 30 225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0 t225 0">
        <animateTransform attributeName="transform" type="translate" from="-900 0" to="0 0" dur="13s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- orbit system -->
    <g transform="translate(770 120)">
      <circle r="7" fill="#38bdf8">
        <animate attributeName="r" values="6;9;6" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="16" fill="none" stroke="#38bdf8" stroke-opacity="0.25">
        <animate attributeName="r" values="12;24;12" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
      </circle>

      <g transform="rotate(0)">
        <ellipse rx="85" ry="26" fill="none" stroke="#a78bfa" stroke-opacity="0.45"/>
        <circle r="5" fill="#a78bfa">
          <animateMotion dur="5s" repeatCount="indefinite" path="M 85 0 A 85 26 0 1 1 -85 0 A 85 26 0 1 1 85 0"/>
        </circle>
      </g>
      <g transform="rotate(60)">
        <ellipse rx="85" ry="26" fill="none" stroke="#38bdf8" stroke-opacity="0.45"/>
        <circle r="5" fill="#38bdf8">
          <animateMotion dur="6.5s" repeatCount="indefinite" path="M 85 0 A 85 26 0 1 1 -85 0 A 85 26 0 1 1 85 0"/>
        </circle>
      </g>
      <g transform="rotate(120)">
        <ellipse rx="85" ry="26" fill="none" stroke="#34d399" stroke-opacity="0.45"/>
        <circle r="5" fill="#34d399">
          <animateMotion dur="8s" repeatCount="indefinite" path="M 85 0 A 85 26 0 1 1 -85 0 A 85 26 0 1 1 85 0"/>
        </circle>
      </g>
    </g>

    <!-- text -->
    <text x="48" y="62" font-family="Courier New, monospace" font-size="16" fill="#94a3b8">|Rohit⟩ = α|AI/ML⟩ + β|Backend⟩ + γ|Android⟩</text>
    <text x="46" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#name)" letter-spacing="2">ROHIT</text>
    <text x="48" y="172" font-family="Courier New, monospace" font-size="17" fill="#e2e8f0">CS graduate · M.Tech Quantum Information &amp; Technology</text>
    <text x="48" y="196" font-family="Courier New, monospace" font-size="15" fill="#64748b">IIIT Allahabad<tspan fill="#38bdf8">▍</tspan>
      <animate attributeName="opacity" values="1;1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="1" y="1" width="898" height="258" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>
