<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="900" height="2" rx="1" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="-240" y="10" width="240" height="4" rx="2" fill="url(#beam)">
    <animate attributeName="x" from="-240" to="900" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="450" cy="12" r="4" fill="#38bdf8">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
